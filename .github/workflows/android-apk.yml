name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK (retry temporary Maven rate limits)
        working-directory: android
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Gradle build attempt $attempt of 4"
            if ./gradlew --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              wait_seconds=$((attempt * 45))
              echo "Build failed. Waiting ${wait_seconds}s before retrying..."
              sleep "$wait_seconds"
            fi
          done
          echo "Gradle build failed after 4 attempts."
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-income-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
